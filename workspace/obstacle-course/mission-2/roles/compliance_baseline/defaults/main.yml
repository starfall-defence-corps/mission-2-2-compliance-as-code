---
# CIS compliance settings
ssh_max_auth_tries: 5          # BUG: CIS 5.2.7 requires 4 or less
ssh_login_grace_time: 60
ssh_client_alive_interval: 300
ssh_client_alive_count_max: 3

banner_text: "STARFALL DEFENCE CORPS — AUTHORISED ACCESS ONLY"

sysctl_settings:
  net.ipv4.ip_forward: 0
  net.ipv4.conf.all.send_redirects: 0
  # BUG: Missing net.ipv4.conf.all.accept_redirects: 0
